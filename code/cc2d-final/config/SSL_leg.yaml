# CC2D SSL settings for the final leg fine-stage model.
train:
  batch_size : 4
  num_workers : 8
  learning_rate : 0.001
  coarse_decay_step : 70
  coarse_decay_gamma : 0.1
  coarse_total_epochs : 160
  coarse_random_epochs : 100
  fine_decay_step : 70
  fine_decay_gamma : 0.1
  fine_total_epochs : 250
  fine_random_epochs : 150
  save_seq : 5
  loss_lambda : 0.001
  input_size : [768, 384]
  patch_size : [192, 192]
  # Leg fine crops need more anatomy context than the default patch.
  # The 1024x512 crop keeps knee/ankle structure visible before resizing
  # back to the network input size, which fixed the lm5/lm15 drift.
  fine_crop_context_size : [1024, 512]
  fine_crop_padding : replicate
  fine_probmap_start_epoch : 0
  fine_sample_margin_ratio : 0.0
test:
  id_oneshot : [118]
  fine_search_radius : 96
